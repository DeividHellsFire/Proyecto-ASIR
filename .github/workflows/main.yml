name: GymTrack CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Comprobar sintaxis PHP
        run: php -l gymtrack-plugin/gymtrack.php

      - name: Ejecutar pruebas de humo
        shell: pwsh
        run: ./tests/smoke-test.ps1

      - name: Validar Docker Compose
        run: docker compose config

      - name: Construir imagen Docker
        run: docker build -t gymtrack:ci .

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Validar manifiestos Kubernetes
        run: kubectl apply --dry-run=client -f k8s/