name: GymTrack CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/gymtrack-wordpress

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Comprobar sintaxis PHP
        run: php -l gymtrack-plugin/gymtrack.php

      - name: Validar Docker Compose
        run: docker compose config

      - name: Construir imagen Docker
        run: docker build -t gymtrack:ci .

      - name: Crear red Docker para CI
        run: docker network create wordpress_default

      - name: Crear volumenes Docker para CI
        run: |
          docker volume create wordpress_wordpress_data
          docker volume create wordpress_db_data

      - name: Levantar entorno Docker
        run: docker compose up -d --build

      - name: Esperar a WordPress
        shell: pwsh
        run: |
          $maxAttempts = 30
          $attempt = 0

          do {
              $attempt++

              try {
                  $response = Invoke-WebRequest `
                      -Uri "http://localhost:8082/" `
                      -Method GET `
                      -UseBasicParsing `
                      -TimeoutSec 5

                  if ([int]$response.StatusCode -eq 200) {
                      Write-Host "WordPress responde correctamente."
                      break
                  }
              }
              catch {
                  Write-Host "Esperando a WordPress... intento $attempt/$maxAttempts"
              }

              Start-Sleep -Seconds 5
          }
          while ($attempt -lt $maxAttempts)

          if ($attempt -ge $maxAttempts) {
              Write-Host "WordPress no respondio dentro del tiempo esperado." -ForegroundColor Red
              docker compose ps
              docker compose logs --tail=100 wordpress
              docker compose logs --tail=100 db
              exit 1
          }

      - name: Inicializar WordPress para CI
        shell: bash
        run: |
          docker run --rm \
            --user 33:33 \
            -e HOME=/tmp \
            -e WORDPRESS_DB_HOST=db:3306 \
            -e WORDPRESS_DB_USER=wordpress \
            -e WORDPRESS_DB_PASSWORD=gymtrack_db_pass \
            -e WORDPRESS_DB_NAME=wordpress \
            --volumes-from gymtrack-wordpress \
            --network container:gymtrack-wordpress \
            wordpress:cli-php8.3 \
            wp core install \
            --url=http://localhost:8082 \
            --title="GymTrack CI" \
            --admin_user=admin \
            --admin_password="GymTrack_CI_Admin_123!" \
            --admin_email=ci@gymtrack.local \
            --skip-email

      - name: Configurar enlaces permanentes
        shell: bash
        run: |
          docker run --rm \
            --user 33:33 \
            -e HOME=/tmp \
            -e WORDPRESS_DB_HOST=db:3306 \
            -e WORDPRESS_DB_USER=wordpress \
            -e WORDPRESS_DB_PASSWORD=gymtrack_db_pass \
            -e WORDPRESS_DB_NAME=wordpress \
            --volumes-from gymtrack-wordpress \
            --network container:gymtrack-wordpress \
            wordpress:cli-php8.3 \
            wp rewrite structure '/%postname%/'

          docker run --rm \
            --user 33:33 \
            -e HOME=/tmp \
            -e WORDPRESS_DB_HOST=db:3306 \
            -e WORDPRESS_DB_USER=wordpress \
            -e WORDPRESS_DB_PASSWORD=gymtrack_db_pass \
            -e WORDPRESS_DB_NAME=wordpress \
            --volumes-from gymtrack-wordpress \
            --network container:gymtrack-wordpress \
            wordpress:cli-php8.3 \
            wp rewrite flush --hard

      - name: Activar plugin GymTrack
        shell: bash
        run: |
          docker run --rm \
            --user 33:33 \
            -e HOME=/tmp \
            -e WORDPRESS_DB_HOST=db:3306 \
            -e WORDPRESS_DB_USER=wordpress \
            -e WORDPRESS_DB_PASSWORD=gymtrack_db_pass \
            -e WORDPRESS_DB_NAME=wordpress \
            --volumes-from gymtrack-wordpress \
            --network container:gymtrack-wordpress \
            wordpress:cli-php8.3 \
            wp plugin activate gymtrack

      - name: Ejecutar pruebas de humo
        shell: pwsh
        run: ./tests/smoke-test.ps1

      - name: Validar manifiestos Kubernetes
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            ghcr.io/yannh/kubeconform:v0.8.0 \
            -summary \
            -strict \
            /work/k8s/

      - name: Apagar entorno Docker
        if: always()
        run: docker compose down -v

  publish-image:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar metadatos de imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  test-self-hosted-runner:
    if: github.event_name == 'workflow_dispatch'
    runs-on:
      - self-hosted
      - Windows
      - X64
      - gymtrack-deploy

    env:
      KUBECONFIG: C:\actions-runner\.kube\config

    steps:
      - name: Comprobar runner
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Sistema operativo: $env:RUNNER_OS"
          Write-Host "Arquitectura: $env:RUNNER_ARCH"

      - name: Comprobar kubectl
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          kubectl version --client

      - name: Comprobar contexto Kubernetes
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          kubectl config current-context

      - name: Comprobar acceso a GymTrack
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          kubectl get pods -n gymtrack

      - name: Comprobar Deployment de WordPress
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          kubectl get deployment gymtrack-wordpress -n gymtrack

      - name: Comprobar permiso de despliegue
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          kubectl auth can-i patch deployment/gymtrack-wordpress -n gymtrack

  deploy-kubernetes:
    needs:
      - test-and-build
      - publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - Windows
      - X64
      - gymtrack-deploy

    env:
      KUBECONFIG: C:\actions-runner\.kube\config
      IMAGE: ghcr.io/deividhellsfire/gymtrack-wordpress:sha-${{ github.sha }}

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Comprobar contexto Kubernetes
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          kubectl config current-context

      - name: Comprobar imagen objetivo
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          Write-Host "Imagen a desplegar: $env:IMAGE"

      - name: Actualizar Deployment de WordPress
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          kubectl set image deployment/gymtrack-wordpress `
            wordpress=$env:IMAGE `
            -n gymtrack

      - name: Esperar al rollout
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          kubectl rollout status deployment/gymtrack-wordpress `
            -n gymtrack `
            --timeout=180s

      - name: Verificar Deployment
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          kubectl get deployment gymtrack-wordpress -n gymtrack

      - name: Verificar Pods
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          kubectl get pods -n gymtrack -l app=gymtrack-wordpress