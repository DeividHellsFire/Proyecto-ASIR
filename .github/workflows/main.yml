name: GymTrack CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gymtrack-wordpress

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mysqli
          tools: composer

      - name: Validate PHP syntax
        run: |
          docker run --rm \
            -v "${PWD}/gymtrack-plugin:/work/gymtrack-plugin" \
            wordpress:php8.3-apache \
            php -l /work/gymtrack-plugin/gymtrack.php

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker image
        run: docker build -t gymtrack-wordpress:test .

      - name: Create Docker network
        run: docker network create wordpress_default

      - name: Create Docker volumes
        run: |
          docker volume create wordpress_db_data
          docker volume create wordpress_wordpress_data

      - name: Start Docker environment
        run: docker compose up -d --build

      - name: Wait for WordPress
        shell: bash
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8082/wp-login.php >/dev/null 2>&1; then
              echo "WordPress disponible"
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Install WP-CLI
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o wp-cli.phar
          docker cp wp-cli.phar gymtrack-wordpress:/tmp/wp-cli.phar
          docker compose exec -T wordpress php /tmp/wp-cli.phar --allow-root --info

      - name: Install WordPress and activate GymTrack
        shell: bash
        run: |
          docker compose exec -T wordpress php /tmp/wp-cli.phar --allow-root core install \
            --path=/var/www/html \
            --url=http://localhost:8082 \
            --title="GymTrack CI" \
            --admin_user=admin \
            --admin_password="gymtrack_ci_password" \
            --admin_email=ci@example.com \
            --skip-email

          docker compose exec -T wordpress php /tmp/wp-cli.phar --allow-root plugin activate gymtrack --path=/var/www/html
          docker compose exec -T wordpress php /tmp/wp-cli.phar --allow-root rewrite structure '/%postname%/' --path=/var/www/html
          docker compose exec -T wordpress php /tmp/wp-cli.phar --allow-root rewrite flush --hard --path=/var/www/html

          # Ejecuta WordPress y comprueba que exista la página del dashboard.
          # Si el plugin no la ha creado automáticamente durante la inicialización,
          # el pipeline crea la página para que los smoke tests puedan validarla.
          curl -fsS http://localhost:8082/wp-login.php >/dev/null

          PAGE_ID=$(docker compose exec -T wordpress php /tmp/wp-cli.phar --allow-root post list \
            --post_type=page --name=gymtrack --post_status=publish --format=ids \
            --path=/var/www/html | tr -d '\r')

          if [ -z "$PAGE_ID" ]; then
            echo "La página GymTrack no existe; se crea para el entorno CI."
            docker compose exec -T wordpress php /tmp/wp-cli.phar --allow-root post create \
              --post_type=page \
              --post_title="GymTrack" \
              --post_name="gymtrack" \
              --post_status=publish \
              --post_content='[gymtrack_dashboard]' \
              --path=/var/www/html
          else
            echo "Página GymTrack encontrada (ID: $PAGE_ID)."
          fi

          # Verificación final: el slug debe existir y estar publicado.
          docker compose exec -T wordpress php /tmp/wp-cli.phar --allow-root post list \
            --post_type=page --name=gymtrack --post_status=publish --format=ids \
            --path=/var/www/html | grep -q '[0-9]' 

      - name: Run smoke tests
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File "./tests/smoke-test.ps1"

      - name: Run functional tests
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File "./tests/functional-test.ps1"

      - name: Run regression tests
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File "./tests/regression-test.ps1"

      - name: Validate Kubernetes manifests
        shell: bash
        run: |
          curl -L --fail --silent --show-error \
            -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          chmod +x kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.34.0 \
            k8s/gymtrack.yaml k8s/gymtrack-ingress.yaml

      - name: Stop Docker environment
        if: always()
        run: docker compose down

  publish-image:
    needs: test-and-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  test-self-hosted-runner:
    needs: publish-image
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows]
    steps:
      - name: Check runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          docker --version
          docker compose version
          kubectl version --client
          kubectl config current-context
          kubectl get namespace gymtrack

  deploy-kubernetes:
    needs: [publish-image, test-self-hosted-runner]
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows]
    steps:
      - name: Deploy image to Kubernetes
        shell: pwsh
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/gymtrack-wordpress:${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          kubectl -n gymtrack set image deployment/gymtrack-wordpress wordpress=$env:IMAGE
          kubectl -n gymtrack rollout status deployment/gymtrack-wordpress --timeout=180s
