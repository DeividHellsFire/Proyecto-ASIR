apiVersion: v1
kind: Namespace
metadata:
  name: gymtrack

---
apiVersion: v1
kind: Secret
metadata:
  name: gymtrack-db-secret
  namespace: gymtrack
type: Opaque
stringData:
  MYSQL_DATABASE: wordpress
  MYSQL_USER: wordpress
  MYSQL_PASSWORD: gymtrack_db_pass
  MYSQL_ROOT_PASSWORD: gymtrack_root_pass
  WORDPRESS_DB_HOST: gymtrack-db:3306
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: gymtrack_db_pass
  WORDPRESS_DB_NAME: wordpress

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gymtrack-db-pvc
  namespace: gymtrack
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gymtrack-wordpress-pvc
  namespace: gymtrack
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gymtrack-db
  namespace: gymtrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gymtrack-db
  template:
    metadata:
      labels:
        app: gymtrack-db
    spec:
      containers:
        - name: mariadb
          image: mariadb:11
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
              protocol: TCP
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: gymtrack-db-secret
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: gymtrack-db-secret
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gymtrack-db-secret
                  key: MYSQL_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gymtrack-db-secret
                  key: MYSQL_ROOT_PASSWORD
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: gymtrack-db-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: gymtrack-db
  namespace: gymtrack
spec:
  type: ClusterIP
  selector:
    app: gymtrack-db
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gymtrack-wordpress
  namespace: gymtrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gymtrack-wordpress
  template:
    metadata:
      labels:
        app: gymtrack-wordpress
    spec:
      containers:
        - name: wordpress
          image: localhost:5001/gymtrack-wordpress:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: WORDPRESS_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: gymtrack-db-secret
                  key: WORDPRESS_DB_HOST
            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: gymtrack-db-secret
                  key: WORDPRESS_DB_USER
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gymtrack-db-secret
                  key: WORDPRESS_DB_PASSWORD
            - name: WORDPRESS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: gymtrack-db-secret
                  key: WORDPRESS_DB_NAME
          volumeMounts:
            - name: wordpress-storage
              mountPath: /var/www/html
      volumes:
        - name: wordpress-storage
          persistentVolumeClaim:
            claimName: gymtrack-wordpress-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: gymtrack-wordpress
  namespace: gymtrack
spec:
  type: NodePort
  selector:
    app: gymtrack-wordpress
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30082
      protocol: TCP
